name: Validate OpenCode FM Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'opencode.json'
      - '.opencode/agents/**'
      - '.github/workflows/validate-opencode-safety.yml'
  push:
    branches: [main]
    paths:
      - 'opencode.json'
      - '.opencode/agents/**'
      - '.github/workflows/validate-opencode-safety.yml'

permissions:
  contents: read

jobs:
  validate-opencode-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OpenCode config
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("opencode.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data.get("$schema") == "https://opencode.ai/config.json"
          permission = data.get("permission", {})
          assert permission.get("edit") == "ask"
          assert permission.get("bash") == "ask"
          assert permission.get("webfetch") == "allow"
          print("OpenCode config: PASS")
          PY

      - name: Validate read-only review agent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path(".opencode/agents/review.md")
          if not p.exists():
              print("Read-only review agent: SKIP (agent is introduced by a separate PR)")
              raise SystemExit(0)

          text = p.read_text(encoding="utf-8")

          required = [
              "mode: subagent",
              "edit: deny",
              "bash: ask",
              "webfetch: deny",
              "Do not modify files",
              "Do not create commits",
              "Do not push changes",
          ]

          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit("Missing safety controls: " + ", ".join(missing))

          print("Read-only review agent: PASS")
          PY
